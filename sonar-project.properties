sonar.projectKey=Pancakeshake_Zombera
sonar.organization=pancakeshake

sonar.sources=Assets
sonar.exclusions=\
  Assets/ThirdParty/**,\
  Assets/UMA/**,\
  Assets/Universal Sound FX/**,\
  Assets/Animations/**,\
  Assets/StreamingAssets/**,\
  Library/**,\
  Packages/**,\
  Temp/**

sonar.coverage.exclusions=Library/**
sonar.cpd.exclusions=Library/**
sonar.issue.ignore.allfile[0].ruleKey=*
sonar.issue.ignore.allfile[0].fileRegexp=.*/Library/.*

sonar.cs.file.suffixes=.cs
